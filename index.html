<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interaktiv plantegning og 3D av Barmuda, Solsiden i Trondheim.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Barmuda Romverksted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
/* Layout: drafting-table app — tool rail + library left, plan sheet centre, inspector right; bottom sheets on phones */
:root{
  --bg:#EEECEF; --panel:#FFFFFF; --panel-2:#F6F4F6; --ink:#221E27; --ink-2:#645C69; --ink-3:#8E8693;
  --line:#E1DCE2; --line-2:#CFC8D1;
  --accent:#A83D66; --accent-ink:#FFFFFF; --accent-soft:#F6E6EC; --accent-line:#E3B7C8;
  --paper:#FBFAF9; --grid:rgba(34,30,39,.055); --grid-major:rgba(34,30,39,.11);
  --wall:#2A2530; --wall-new:#A83D66; --wall-demo:#C4473F; --wall-ghost:rgba(42,37,48,.18);
  --floor:#F1ECE6; --floor-2:#ECE6EF; --level:#E6DACB; --level-2:#EDE3D6; --patio:#E4E9E2; --void:rgba(42,37,48,.10);
  --f-bar:#C79B6B; --f-bar-top:#EFE4D6; --f-seat:#9A7390; --f-seat-2:#C9A9BE; --f-table:#E2DAD0; --f-stage:#7C8896;
  --f-equip:#9FB0A6; --f-fix:#D6D1D8; --f-plant:#7FA07A; --f-zone:rgba(168,61,102,.09); --sel:#2F7BD8;
  --ok:#2E7D5B; --warn:#B7791F;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-ui:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --r-s:7px;
  --shadow:0 1px 2px rgba(20,16,24,.06), 0 8px 24px rgba(20,16,24,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141217; --panel:#1C1920; --panel-2:#231F28; --ink:#EEE9F0; --ink-2:#ABA2AF; --ink-3:#7F7784;
  --line:#2F2A35; --line-2:#3E3844;
  --accent:#E586A9; --accent-ink:#1A1116; --accent-soft:#3A2230; --accent-line:#6B3A50;
  --paper:#1A181E; --grid:rgba(238,233,240,.045); --grid-major:rgba(238,233,240,.09);
  --wall:#E6E0EA; --wall-new:#E586A9; --wall-demo:#F07A70; --wall-ghost:rgba(230,224,234,.16);
  --floor:#222027; --floor-2:#24212B; --level:#3A322B; --level-2:#332C27; --patio:#1F2621; --void:rgba(230,224,234,.07);
  --f-bar:#B98A5B; --f-bar-top:#4A3F35; --f-seat:#9C7792; --f-seat-2:#5E4858; --f-table:#4B4550; --f-stage:#6D7987;
  --f-equip:#5F7368; --f-fix:#3D3843; --f-plant:#5F8559; --f-zone:rgba(229,134,169,.10); --sel:#6AA8F2;
  --ok:#5CC195; --warn:#E0A64A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141217; --panel:#1C1920; --panel-2:#231F28; --ink:#EEE9F0; --ink-2:#ABA2AF; --ink-3:#7F7784;
  --line:#2F2A35; --line-2:#3E3844;
  --accent:#E586A9; --accent-ink:#1A1116; --accent-soft:#3A2230; --accent-line:#6B3A50;
  --paper:#1A181E; --grid:rgba(238,233,240,.045); --grid-major:rgba(238,233,240,.09);
  --wall:#E6E0EA; --wall-new:#E586A9; --wall-demo:#F07A70; --wall-ghost:rgba(230,224,234,.16);
  --floor:#222027; --floor-2:#24212B; --level:#3A322B; --level-2:#332C27; --patio:#1F2621; --void:rgba(230,224,234,.07);
  --f-bar:#B98A5B; --f-bar-top:#4A3F35; --f-seat:#9C7792; --f-seat-2:#5E4858; --f-table:#4B4550; --f-stage:#6D7987;
  --f-equip:#5F7368; --f-fix:#3D3843; --f-plant:#5F8559; --f-zone:rgba(229,134,169,.10); --sel:#6AA8F2;
  --ok:#5CC195; --warn:#E0A64A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 300px;grid-template-rows:56px minmax(0,1fr);grid-template-areas:"top top top" "left stage right"}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
.brand b{font:700 19px/1 var(--font-display);letter-spacing:-.01em}
.brand span{font:500 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand .pname{font:400 13px var(--font-ui);letter-spacing:0;text-transform:none;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;max-width:220px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-weight:500;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--wall-demo)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:var(--r-s);background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
.icon-btn:disabled{opacity:.35}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* left */
.left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);padding:8px 4px 6px;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tool kbd{font:500 10px var(--font-num);color:var(--ink-3)}
.lib-head{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.lib-head h2,.pane h2{font:600 11px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0}
.search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-s);padding:7px 10px}
.lib{overflow:auto;padding:0 12px 16px;min-height:0;flex:1}
.lib h3{font:600 12.5px var(--font-ui);margin:14px 2px 8px;color:var(--ink)}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib-item{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.2;text-align:center;color:var(--ink-2);touch-action:pan-y;user-select:none}
#plan > g *,.lib-item svg *{vector-effect:non-scaling-stroke}
.lib-item:hover{border-color:var(--accent-line);color:var(--ink)}
.lib-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.lib-item svg{width:52px;height:40px}
.lib-item small{font:400 10px var(--font-num);color:var(--ink-3)}

/* stage */
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;display:block}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.zoom button{border:0;background:transparent;width:36px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--panel-2);color:var(--ink)}
.scalebar{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:3px;font:500 11px var(--font-num);color:var(--ink-2);pointer-events:none}
.scalebar i{display:block;height:6px;border:1.5px solid var(--ink-2);border-top:0}
.compass{position:absolute;right:14px;top:12px;font:500 11px var(--font-num);color:var(--ink-3);pointer-events:none;text-align:right;line-height:1.35}
.float-card{position:absolute;left:14px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;max-width:260px}
.float-card label{display:flex;align-items:center;gap:8px;cursor:pointer}
.view3d-bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:13px}

/* right */
.right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
.pane{padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.pane h1{font:700 18px/1.15 var(--font-display);margin:0;text-wrap:balance}
.pane .sub{color:var(--ink-2);font-size:12.5px;margin:-8px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px}
.stat b{display:block;font:500 20px/1.1 var(--font-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.field>span{font-size:11.5px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-s);padding:7px 9px;min-width:0;width:100%}
.field textarea{min-height:64px;resize:vertical}
.unit{position:relative}
.unit input{padding-right:26px;font-family:var(--font-num)}
.unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:normal 11px var(--font-num);color:var(--ink-3);pointer-events:none}
.toggles{display:flex;flex-direction:column;gap:2px}
.toggles label{display:flex;align-items:center;gap:9px;padding:5px 2px;cursor:pointer;font-size:13px}
.toggles input{accent-color:var(--accent);width:16px;height:16px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.sw{width:26px;height:8px;border-radius:2px}
.note{font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px}
.note b{color:var(--ink);font-weight:600}
.warn{font-size:12.5px;color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r-s);padding:8px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.ex{color:var(--ink)}
.pill.new{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.pill.demo{color:var(--wall-demo);border-color:color-mix(in srgb,var(--wall-demo) 40%,transparent)}
.rot-row{display:flex;gap:6px;align-items:center}
.rot-row input[type=range]{flex:1;accent-color:var(--accent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.ops{display:flex;flex-direction:column;gap:6px}
.op{display:grid;grid-template-columns:1fr 78px 78px 30px;gap:6px;align-items:end;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-s);padding:7px}
.op b{font-size:12px;align-self:center}
.divider{height:1px;background:var(--line);margin:2px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(15,12,18,.38);display:grid;place-items:center;z-index:40;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;min-height:0}
.dialog header{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dialog header h2{font:700 19px var(--font-display);margin:0;flex:1}
.dialog .body{padding:16px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.dialog h3{font:600 13px var(--font-ui);margin:0}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.start{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.start:hover{border-color:var(--accent-line)}
.start b{font-weight:600;font-size:13px}
.start span{font-size:12px;color:var(--ink-2)}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--panel)}
.pcard .thumb{width:96px;height:72px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.pcard .thumb svg{width:100%;height:100%}
.pcard b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard span{font-size:12px;color:var(--ink-2)}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:16px;color:var(--ink-2);font-size:13px;text-align:center}
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.help-grid div{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.help-grid b{display:block;margin-bottom:4px}
.help-grid p{margin:0;font-size:12.5px;color:var(--ink-2)}
kbd{font:500 11px var(--font-num);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.menu{position:absolute;right:14px;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;z-index:30;min-width:230px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;display:flex;flex-direction:column}
.menu button:hover{background:var(--panel-2)}
.menu button span{font-size:11.5px;color:var(--ink-2)}
.coach{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 14px;z-index:20;display:flex;flex-direction:column;gap:10px}
.coach h2{font:700 20px/1.15 var(--font-display);margin:0;text-wrap:balance}
.coach ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.coach p{margin:0;color:var(--ink-2);font-size:12.5px}

/* plan svg classes */
.pl-paper{fill:var(--paper)}
.pl-floor{fill:var(--floor)}
.pl-floor2{fill:var(--floor-2)}
.pl-patio{fill:var(--patio);stroke:var(--ink-3);stroke-dasharray:4 3}
.pl-level{fill:var(--level);stroke:var(--ink-3)}
.pl-void{fill:url(#hatch-void);stroke:none}
.pl-edge{fill:none;stroke:var(--ink-2);stroke-dasharray:7 4}
.pl-rail{fill:none;stroke:var(--wall)}
.pl-wall{fill:var(--wall)}
.pl-wall.new{fill:var(--wall-new)}
.pl-wall.demo{fill:url(#hatch-demo);stroke:var(--wall-demo);stroke-dasharray:4 3}
.pl-wall.ghost{fill:var(--wall-ghost)}
.pl-door{fill:none;stroke:var(--ink-2)}
.pl-win{fill:var(--paper);stroke:var(--wall)}
.pl-label{fill:var(--ink-2);font-family:var(--font-ui);font-weight:500}
.pl-room{fill:var(--ink-3);font-family:var(--font-ui);font-weight:600;letter-spacing:.08em}
.pl-dim{fill:var(--ink);font-family:var(--font-num);font-weight:500}
.pl-dimline{stroke:var(--ink);fill:none}
.pl-sel{fill:none;stroke:var(--sel)}
.pl-handle{fill:var(--panel);stroke:var(--sel)}
.pl-hit{fill:transparent;stroke:transparent}
.it-bar{fill:var(--f-bar);stroke:color-mix(in srgb,var(--f-bar) 60%,var(--ink))}
.it-bartop{fill:var(--f-bar-top)}
.it-seat{fill:var(--f-seat);stroke:color-mix(in srgb,var(--f-seat) 60%,var(--ink))}
.it-seat2{fill:var(--f-seat-2)}
.it-table{fill:var(--f-table);stroke:color-mix(in srgb,var(--f-table) 55%,var(--ink))}
.it-stage{fill:var(--f-stage);stroke:color-mix(in srgb,var(--f-stage) 60%,var(--ink))}
.it-equip{fill:var(--f-equip);stroke:color-mix(in srgb,var(--f-equip) 55%,var(--ink))}
.it-fix{fill:var(--f-fix);stroke:var(--ink-3)}
.it-plant{fill:var(--f-plant);stroke:color-mix(in srgb,var(--f-plant) 60%,var(--ink))}
.it-ink{fill:var(--wall)}
.it-line{fill:none;stroke:color-mix(in srgb,var(--ink) 55%,transparent)}
.it-zone{fill:var(--f-zone);stroke:var(--accent);stroke-dasharray:6 4}
.it-stair{fill:var(--panel);stroke:var(--ink-2)}
.it-text{fill:var(--ink);font-family:var(--font-ui);font-weight:600}
.it-notebg{fill:var(--panel);stroke:var(--accent)}
.demo-item{opacity:.55}
